[package]
name = "cosmic-applet-plex"
version = "0.1.0"
edition = "2024"
description = "Local Plex Media Server status and library scanning for COSMIC"

[features]
default = ["applet"]
applet = ["dep:libcosmic"]

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", optional = true, default-features = false, features = ["applet", "tokio", "wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roxmltree = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[[bin]]
name = "cosmic-applet-plex"
path = "src/main.rs"
required-features = ["applet"]